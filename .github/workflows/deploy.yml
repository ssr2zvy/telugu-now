name: Fly deployment (scaffolding)

# Inactive scaffolding: manual dispatch skips the job, and merges do not trigger it.
# To enable: configure the Actions FLY_API_TOKEN secret, replace the false job
# condition with github.ref == 'refs/heads/main', and uncomment the push trigger.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the app or stop its Machines (disabled scaffolding)
        type: choice
        options: [deploy, stop]
        default: deploy
        required: true

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy or stop
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
        run: bash ci-cd/deploy.sh "$DEPLOY_ACTION"
